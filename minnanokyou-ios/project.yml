# XcodeGen の設定ファイル。Mac で `xcodegen generate` を実行すると MinnanoKyou.xcodeproj が作られます。
name: MinnanoKyou
options:
  bundleIdPrefix: jp.minnanokyou
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ja
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""          # Apple Developer の Team ID を入れる
    TARGETED_DEVICE_FAMILY: "1"   # iPhone のみ
targets:
  MinnanoKyou:
    type: application
    platform: iOS
    sources:
      - path: MinnanoKyou
    entitlements:
      path: MinnanoKyou/MinnanoKyou.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.jp.minnanokyou.app
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.usernotifications.time-sensitive: true
        aps-environment: development
    info:
      path: MinnanoKyou/Info.plist
      properties:
        CFBundleDisplayName: みんなのきょう
        CFBundleDevelopmentRegion: ja
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [remote-notification]
        CKSharingSupported: true
        ITSAppUsesNonExemptEncryption: false
        UISupportsAssistiveAccess: true   # Assistive Access 対応（実機で要確認）
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.minnanokyou.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  MinnanoKyouTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MinnanoKyouTests]
    dependencies:
      - target: MinnanoKyou
