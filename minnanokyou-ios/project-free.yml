# 【無料の Apple ID 用・試作版】`xcodegen generate --spec project-free.yml` で MinnanoKyou.xcodeproj を作る。
# iCloud・家族の共有・時間指定通知は使わない（無料の Apple ID では使えないため）。データはその iPhone の中だけ。
name: MinnanoKyou
options:
  bundleIdPrefix: jp.minnanokyou
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ja
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""          # Apple Developer の Team ID を入れる
    TARGETED_DEVICE_FAMILY: "1"   # iPhone のみ
targets:
  MinnanoKyou:
    type: application
    platform: iOS
    sources:
      - path: MinnanoKyou
    info:
      path: MinnanoKyou/Info.plist
      properties:
        CFBundleDisplayName: みんなのきょう
        CFBundleDevelopmentRegion: ja
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        UISupportsAssistiveAccess: true   # Assistive Access 対応（実機で要確認）
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.minnanokyou.trial   # 自分だけの名前に変える（例：jp.自分の名前.minnanokyou）
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) LOCAL_ONLY"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  MinnanoKyouTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MinnanoKyouTests]
    dependencies:
      - target: MinnanoKyou
